
services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: goalstream-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
    # gives this Kafka server its ID
      KAFKA_NODE_ID: 1
    # KAFKA_PROCESS_ROLES: "broker,controller" configures it as both a broker (handles messages) and 
    # a controller (manages the cluster). This is a single-node KRaft setup, so it doesn’t need ZooKeeper.
      KAFKA_PROCESS_ROLES: "broker,controller"
    # configures Kafka to listen on port 9092 for clients and 
    # 9093 for controller communication.
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g

volumes:
  kafka-data:

